<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionalidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Adicionado o marked.js -->
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-info text-white text-center">
                <h3>Funcionalidades</h3>
            </div>
            <div class="card-body">
                <h4 class="mb-3">Relatório: Tempo no Status Atual</h4>

                <!-- Tabela do relatório -->
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>Escola</th>
                                <th>Status Atual</th>
                                <th>Tempo no Status (dias)</th>
                            </tr>
                        </thead>
                        <tbody id="relatorio-tabela">
                            <tr>
                                <td colspan="3" class="text-center">Carregando dados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botão para gerar resumo com IA -->
                <div class="text-center mt-4">
                    <button id="gerar-resumo" class="btn btn-primary">Gerar Resumo do Dia</button>
                </div>

                <!-- Exibição do Resumo Gerado -->
                <div class="mt-4 p-3 border rounded bg-light" id="resumo-container" style="display: none;">
                    <h5>📌 Resumo do Dia</h5>
                    <div id="resumo-texto"></div> <!-- Agora será renderizado com Markdown -->
                </div>

                <!-- Botão para voltar à tela principal -->
                <div class="text-center mt-4">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Voltar</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Buscar dados do relatório
        fetch("/relatorio_tempo_status")
            .then(response => response.json())
            .then(data => {
                let tabela = document.getElementById("relatorio-tabela");
                tabela.innerHTML = ""; // Limpa os dados iniciais
                
                if (data.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="3" class="text-center">Nenhum dado disponível</td></tr>`;
                } else {
                    data.forEach(item => {
                        let row = `
                            <tr>
                                <td>${item.escola}</td>
                                <td>${item.status}</td>
                                <td>${item.tempo_status}</td>
                            </tr>
                        `;
                        tabela.innerHTML += row;
                    });
                }
            })
            .catch(error => {
                console.error("Erro ao buscar relatório:", error);
                document.getElementById("relatorio-tabela").innerHTML = `<tr><td colspan="3" class="text-center text-danger">Erro ao buscar dados. Verifique a API.</td></tr>`;
            });

        // Função para chamar a IA Generativa e gerar o resumo com Markdown
        document.getElementById("gerar-resumo").addEventListener("click", () => {
            let resumoContainer = document.getElementById("resumo-container");
            let resumoTexto = document.getElementById("resumo-texto");

            resumoContainer.style.display = "block";
            resumoTexto.innerHTML = "<p>Gerando resumo...</p>";

            fetch("/gerar_resumo_gemini")
                .then(response => response.json())
                .then(data => {
                    resumoTexto.innerHTML = marked.parse(data.resumo); // Renderiza Markdown corretamente
                })
                .catch(error => {
                    console.error("Erro ao gerar resumo:", error);
                    resumoTexto.innerHTML = "<p class='text-danger'>Erro ao gerar resumo. Tente novamente.</p>";
                });
        });
    </script>
</body>
</html>
